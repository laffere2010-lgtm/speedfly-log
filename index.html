<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Speedfly Logbook</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Speedfly Log">
  
  <link rel="apple-touch-icon" href="IMG_7689_3.jpg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      color: #ffffff;
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #0a1428;
    }

    /* FULLPAGE BACKGROUND IMAGE */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('IMG_7689_3.jpg');
      background-size: cover;
      background-position: center bottom;
      z-index: -2;
    }

    /* SEMI-TRANSPARENT DARK OVERLAY FOR READABILITY */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 20, 40, 0.65);
      z-index: -1;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: rgba(10, 20, 40, 0.75);
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(135, 206, 235, 0.35);
      backdrop-filter: blur(8px);
    }

    .header-title-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon-svg {
      width: 26px;
      height: 26px;
    }

    h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 800;
      color: #87ceeb;
    }

    .header-badges {
      display: flex;
      gap: 6px;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-badge {
      background: rgba(135, 206, 235, 0.15);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.75rem;
      border: 1px solid rgba(135, 206, 235, 0.4);
    }

    .sync-status {
      font-size: 0.7rem;
      font-weight: 600;
      color: #87ceeb;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card, .settings-card {
      background: rgba(10, 20, 40, 0.75);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(135, 206, 235, 0.4);
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .settings-card h2 {
      margin-top: 0;
      font-size: 1.05rem;
      color: #87ceeb;
      border-bottom: 1px solid rgba(135, 206, 235, 0.2);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    /* FIXED DATE / TIME ROW ALIGNMENT */
    .date-time-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .date-time-row > div {
      flex: 1;
      min-width: 0;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #4ade80;
      margin-bottom: 6px;
    }

    .pill-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-btn {
      flex: 1 1 calc(33.33% - 6px);
      min-height: 40px;
      background: rgba(10, 20, 40, 0.5);
      backdrop-filter: blur(2px);
      border: 1px solid #87ceeb;
      border-radius: 8px;
      color: #4ade80;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
    }

    .pill-btn.active {
      background: #87ceeb;
      color: #0a1428;
      border-color: #87ceeb;
      font-weight: 800;
    }

    input[type="text"], 
    input[type="number"], 
    input[type="date"], 
    input[type="time"], 
    select, 
    textarea {
      width: 100%;
      height: 44px;
      padding: 8px 12px;
      background: rgba(10, 20, 40, 0.7);
      border: 1px solid #4ade80;
      border-radius: 8px;
      color: #87ceeb;
      font-size: 0.95rem;
      font-weight: 600;
      box-sizing: border-box;
      -webkit-appearance: none;
    }

    textarea {
      height: auto;
      padding: 10px 12px;
    }

    input[type="text"]:focus, 
    input[type="number"]:focus, 
    input[type="date"]:focus, 
    input[type="time"]:focus, 
    select:focus, 
    textarea:focus {
      outline: none;
      border-color: #87ceeb;
      background: rgba(10, 20, 40, 0.9);
    }

    .submit-btn {
      width: 100%;
      min-height: 50px;
      background: #22c55e;
      color: #0a1428;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }

    .submit-btn.editing {
      background: #87ceeb;
    }

    .cancel-btn {
      width: 100%;
      min-height: 40px;
      background: rgba(135, 206, 235, 0.15);
      color: #ffffff;
      border: 1px solid rgba(135, 206, 235, 0.4);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    /* CALENDAR WIDGET */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .calendar-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: #87ceeb;
    }

    .calendar-nav-btn {
      background: rgba(135, 206, 235, 0.15);
      border: 1px solid rgba(135, 206, 235, 0.4);
      color: #ffffff;
      border-radius: 6px;
      padding: 2px 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .cal-day-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #4ade80;
      padding-bottom: 4px;
    }

    .cal-cell {
      padding: 6px 0;
      font-size: 0.8rem;
      border-radius: 6px;
      background: rgba(135, 206, 235, 0.05);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }

    .cal-cell.empty {
      background: transparent;
      cursor: default;
    }

    .cal-cell.has-flight {
      background: #87ceeb;
      color: #0a1428;
      font-weight: 800;
    }

    .cal-cell.selected-date {
      outline: 2px solid #4ade80;
      outline-offset: -2px;
    }

    /* HISTOGRAM WIDGET */
    .histogram-container {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 100px;
      padding-top: 10px;
    }

    .histo-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }

    .histo-bar {
      width: 100%;
      background: #87ceeb;
      border-radius: 4px 4px 0 0;
      min-height: 2px;
      transition: height 0.3s ease;
    }

    .histo-count {
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 2px;
      color: #4ade80;
    }

    .histo-label {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
      white-space: nowrap;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .export-btn {
      background: rgba(135, 206, 235, 0.15);
      border: 1px solid rgba(135, 206, 235, 0.4);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .log-item {
      background: rgba(10, 20, 40, 0.75);
      border: 1px solid rgba(135, 206, 235, 0.4);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .log-site-header {
      font-weight: 800;
      color: #ffffff;
      font-size: 1.05rem;
    }

    .log-datetime-subheader {
      font-size: 0.82rem;
      font-weight: 700;
      color: #87ceeb;
      margin-bottom: 2px;
    }

    .log-meta {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.75);
    }

    .log-meta b { color: #87ceeb; }

    .action-row {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: rgba(135, 206, 235, 0.1);
      border: 1px solid rgba(135, 206, 235, 0.3);
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .log-num {
      font-weight: 800;
      font-size: 1.1rem;
      color: #ffffff;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(10, 20, 40, 0.9);
      border-top: 1px solid rgba(135, 206, 235, 0.4);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: rgba(135, 206, 235, 0.6);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      width: 33.33%;
    }

    .nav-item.active {
      color: #87ceeb;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .settings-list-item {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(135, 206, 235, 0.2);
    }

    .settings-list-item input[type="text"] {
      padding: 6px 8px;
      font-size: 0.85rem;
      height: 36px;
      flex: 1;
    }

    .settings-list-item input[type="number"] {
      width: 80px;
      padding: 6px 8px;
      font-size: 0.85rem;
      height: 36px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title-container">
        <svg class="app-icon-svg" viewBox="0 0 100 100" fill="#87ceeb" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 40 Q 50 10 90 40 Q 50 25 10 40 Z" fill="#87ceeb"/>
          <path d="M20 40 L50 75 L80 40" stroke="#87ceeb" stroke-width="3" fill="none"/>
          <circle cx="50" cy="78" r="4" fill="#87ceeb"/>
        </svg>
        <div>
          <h1>Speedfly Log</h1>
          <div class="sync-status" id="syncStatus">Checking connection...</div>
        </div>
      </div>
      <div class="header-badges">
        <div class="stat-badge" id="totalFlightsBadge">0 Flights</div>
        <div class="stat-badge" id="totalVertBadge">0 ft Vert</div>
      </div>
    </header>

    <!-- TAB 1: LOG FLIGHT FORM -->
    <div id="tab-log" class="tab-content active">
      <div class="card">
        <form id="logForm">
          <div class="form-group">
            <div class="date-time-row">
              <div>
                <label for="flightDate">Flight Date</label>
                <input type="date" id="flightDate">
              </div>
              <div>
                <label for="flightTime">Launch Time</label>
                <input type="time" id="flightTime">
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Wing</label>
            <div class="pill-grid" id="wingPillGrid"></div>
          </div>

          <div class="form-group">
            <label for="launchSiteSelect">Launch Site</label>
            <select id="launchSiteSelect"></select>
          </div>

          <div class="form-group">
            <label for="launchElevation">Launch Elevation (ft)</label>
            <input type="number" id="launchElevation" placeholder="e.g. 1600">
          </div>

          <div class="form-group">
            <label>Launch Type</label>
            <div class="pill-grid" id="launchTypeGrid">
              <button type="button" class="pill-btn active" data-value="Foot launch" style="flex: 1 1 calc(50% - 6px);">Foot Launch</button>
              <button type="button" class="pill-btn" data-value="Ski launch" style="flex: 1 1 calc(50% - 6px);">Ski Launch</button>
            </div>
          </div>

          <div class="form-group">
            <label>Wind Speed & Quality</label>
            <div style="margin-bottom: 8px;">
              <input type="number" id="windSpeed" placeholder="Wind Speed (kt / mph)">
            </div>
            <div class="pill-grid" id="windDescGrid" style="margin-bottom: 12px;">
              <button type="button" class="pill-btn active" data-value="Dead">Dead</button>
              <button type="button" class="pill-btn" data-value="Smooth">Smooth</button>
              <button type="button" class="pill-btn" data-value="Punchy">Punchy</button>
              <button type="button" class="pill-btn" data-value="Moderate Turb">Mod Turb</button>
              <button type="button" class="pill-btn" data-value="Severe Turb">Sev Turb</button>
            </div>

            <label style="margin-top: 10px;">Compass Direction</label>
            <div class="pill-grid" id="compassGrid" style="margin-bottom: 12px;">
              <button type="button" class="pill-btn active" data-value="N">N</button>
              <button type="button" class="pill-btn" data-value="NE">NE</button>
              <button type="button" class="pill-btn" data-value="E">E</button>
              <button type="button" class="pill-btn" data-value="SE">SE</button>
              <button type="button" class="pill-btn" data-value="S">S</button>
              <button type="button" class="pill-btn" data-value="SW">SW</button>
              <button type="button" class="pill-btn" data-value="W">W</button>
              <button type="button" class="pill-btn" data-value="NW">NW</button>
            </div>

            <label style="margin-top: 10px;">Relative Wind Vector</label>
            <div class="pill-grid" id="relativeWindGrid">
              <button type="button" class="pill-btn active" data-value="Headwind">Headwind</button>
              <button type="button" class="pill-btn" data-value="Crosswind">Crosswind</button>
              <button type="button" class="pill-btn" data-value="Tailwind">Tailwind</button>
            </div>
          </div>

          <div class="form-group">
            <label for="notes">Notes / Conditions</label>
            <textarea id="notes" rows="2" placeholder="Smooth line, tight proximity run..."></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">+ Log Flight</button>
          <button type="button" class="cancel-btn hidden" id="cancelEditBtn">Cancel Editing</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: FLIGHT LOG HISTORY WITH GRAPHICS -->
    <div id="tab-history" class="tab-content">
      <!-- CALENDAR CARD -->
      <div class="settings-card">
        <div class="calendar-header">
          <button class="calendar-nav-btn" id="calPrevBtn">&lt;</button>
          <div class="calendar-title" id="calTitle">Month Year</div>
          <button class="calendar-nav-btn" id="calNextBtn">&gt;</button>
        </div>
        <div class="calendar-grid">
          <div class="cal-day-label">S</div><div class="cal-day-label">M</div><div class="cal-day-label">T</div>
          <div class="cal-day-label">W</div><div class="cal-day-label">T</div><div class="cal-day-label">F</div>
          <div class="cal-day-label">S</div>
        </div>
        <div class="calendar-grid" id="calendarDaysGrid"></div>
      </div>

      <!-- ELEVATION HISTOGRAM CARD -->
      <div class="settings-card">
        <h2>Elevation Distribution</h2>
        <div class="histogram-container" id="histogramContainer"></div>
      </div>

      <div class="card">
        <div class="history-header">
          <h2 style="font-size: 1.1rem; margin: 0; color: #87ceeb;">Flight History</h2>
          <button class="export-btn" id="exportBtn">Export CSV</button>
        </div>
        <div class="filter-row">
          <select id="filterWingSelect"><option value="">All Wings</option></select>
          <select id="filterSiteSelect"><option value="">All Sites</option></select>
        </div>
        <div id="logList"></div>
      </div>
    </div>

    <!-- TAB 3: SETTINGS -->
    <div id="tab-settings" class="tab-content">
      <div class="settings-card">
        <h2>Manage Launch Sites</h2>
        <div id="sitesSettingsList"></div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
          <input type="text" id="newSiteName" placeholder="New Launch Site Name">
          <input type="number" id="newSiteElev" placeholder="Elev (ft)" style="width: 100px;">
          <button type="button" id="addNewSiteBtn" style="padding: 0 12px; background: #22c55e; color: #0a1428; border: none; border-radius: 8px; font-weight: 700;">Add</button>
        </div>
      </div>

      <div class="settings-card">
        <h2>Manage Wings</h2>
        <div id="wingsSettingsList"></div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
          <input type="text" id="newWingName" placeholder="New Wing (e.g. Dragonfly 16m)">
          <button type="button" id="addNewWingBtn" style="padding: 0 12px; background: #22c55e; color: #0a1428; border: none; border-radius: 8px; font-weight: 700;">Add</button>
        </div>
      </div>

      <div class="settings-card">
        <h2>Database & Cloud Sync</h2>
        <p style="font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 12px;">Connected to Supabase database for multi-device sync.</p>
        <button type="button" id="manualSyncBtn" style="width: 100%; padding: 12px; background: rgba(135,206,235,0.15); border: 1px solid rgba(135,206,235,0.4); border-radius: 8px; font-weight: 700; color: #ffffff; cursor: pointer;">🔄 Force Re-Sync with Cloud</button>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="tab-log">
      <span style="font-size: 1.25rem; margin-bottom: 2px;">✏️</span>
      <span>Log Flight</span>
    </button>
    <button class="nav-item" data-tab="tab-history">
      <span style="font-size: 1.25rem; margin-bottom: 2px;">📋</span>
      <span>Flight Log</span>
    </button>
    <button class="nav-item" data-tab="tab-settings">
      <span style="font-size: 1.25rem; margin-bottom: 2px;">⚙️</span>
      <span>Settings</span>
    </button>
  </nav>

  <script>
    const navItems = document.querySelectorAll('.nav-item');
    const tabContents = document.querySelectorAll('.tab-content');

    function switchTab(tabId) {
      navItems.forEach(item => {
        if (item.dataset.tab === tabId) item.classList.add('active');
        else item.classList.remove('active');
      });
      tabContents.forEach(tab => {
        if (tab.id === tabId) tab.classList.add('active');
        else tab.classList.remove('active');
      });
      window.scrollTo(0, 0);
    }

    navItems.forEach(item => item.addEventListener('click', () => switchTab(item.dataset.tab)));

    const flightDateInput = document.getElementById('flightDate');
    const flightTimeInput = document.getElementById('flightTime');
    
    function setDefaultDateTime() {
      const now = new Date();
      flightDateInput.value = now.toISOString().split('T')[0];
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      flightTimeInput.value = `${hours}:${minutes}`;
    }
    setDefaultDateTime();

    const SUPABASE_URL = 'https://adztevoxbgftaifwzbyj.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkenRldm94YmdmdGFpZnd6YnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNDMxNjksImV4cCI6MjEwODgxOTE2OX0.vv4_h1HxtUW9IqnB5ogi9GisZO2bOPArqWcLDne_Its';
    
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    const syncStatus = document.getElementById('syncStatus');

    const defaultSiteElevations = {
      "Bingen-South": 1600, "Bingen-East": 2110, "Syncline": 900, "Kiwanda": 100,
      "Mt Hood - Cooper Spur": 300, "Mt Hood - Palmer": 1900, "Rowena": 1800,
      "Dougs Beach": 1600, "Tiger": 1600, "Chelan-Dos": 1500, "Chelan-Tres": 2000,
      "Chelan-Shitshow": 1100, "Chelan-FYIG": 1100, "Chelan-Pirates": 900,
      "Chelan- Deer Mountain": 2500, "Chelan- Airport ridge": 500, "Raptor Ride": 1900,
      "Winchester Mountain": 1000, "Maury Island": 360, "Lauterbrunnen - Murren": 2700,
      "Lauterbrunnen - Manlichen North": 5280, "Lauterbrunnen - Manlichen West": 3380
    };

    let siteElevations = JSON.parse(localStorage.getItem('speedfly_site_elevations') || 'null');
    if (!siteElevations) {
      siteElevations = defaultSiteElevations;
      localStorage.setItem('speedfly_site_elevations', JSON.stringify(siteElevations));
    }

    let customWings = JSON.parse(localStorage.getItem('speedfly_wings') || '["Dragonfly 18m", "Dragonfly 16m"]');
    let flights = JSON.parse(localStorage.getItem('speedfly_flights') || '[]');
    let editingFlightId = null;

    let selectedWing = customWings[0] || 'Dragonfly 18m';
    let selectedLaunchType = 'Foot launch';
    let selectedWindDesc = 'Dead';
    let selectedCompass = 'N';
    let selectedRelativeWind = 'Headwind';

    let calCurrentDate = new Date();
    let selectedCalFilterDate = null;

    const logForm = document.getElementById('logForm');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const wingPillGrid = document.getElementById('wingPillGrid');
    const launchTypeGrid = document.getElementById('launchTypeGrid');
    const windDescGrid = document.getElementById('windDescGrid');
    const compassGrid = document.getElementById('compassGrid');
    const relativeWindGrid = document.getElementById('relativeWindGrid');
    const launchSiteSelect = document.getElementById('launchSiteSelect');
    const launchElevation = document.getElementById('launchElevation');
    const totalFlightsBadge = document.getElementById('totalFlightsBadge');
    const totalVertBadge = document.getElementById('totalVertBadge');
    const logList = document.getElementById('logList');
    const exportBtn = document.getElementById('exportBtn');
    const filterWingSelect = document.getElementById('filterWingSelect');
    const filterSiteSelect = document.getElementById('filterSiteSelect');

    function populateWingsUI() {
      wingPillGrid.innerHTML = customWings.map(w => `
        <button type="button" class="pill-btn ${w === selectedWing ? 'active' : ''}" data-value="${w}">${w}</button>
      `).join('');
    }

    function populateSitesDropdown() {
      const siteOptions = Object.keys(siteElevations).map(site => `
        <option value="${site}">${site}</option>
      `).join('');
      launchSiteSelect.innerHTML = siteOptions;
      filterSiteSelect.innerHTML = '<option value="">All Sites</option>' + siteOptions;
      updateElevationForSelectedSite();
    }

    function populateFilterWings() {
      filterWingSelect.innerHTML = '<option value="">All Wings</option>' + 
        customWings.map(w => `<option value="${w}">${w}</option>`).join('');
    }

    function getFlightTimestamp(rawDate, rawTime) {
      if (!rawDate) return Date.now();
      const timeStr = rawTime || '12:00';
      return new Date(`${rawDate}T${timeStr}:00`).getTime() || Date.now();
    }

    function reindexFlightNumbers() {
      flights.sort((a, b) => getFlightTimestamp(a.rawDate, a.rawTime) - getFlightTimestamp(b.rawDate, b.rawTime));
      flights.forEach((f, idx) => f.flightNum = idx + 1);
    }

    async function syncWithCloud() {
      if (!supabaseClient) {
        syncStatus.textContent = "⚡ Offline Mode";
        return;
      }
      try {
        if (!navigator.onLine) return syncStatus.textContent = "⚡ Offline";
        syncStatus.textContent = "🔄 Syncing...";
        const { data, error } = await supabaseClient.from('flights').select('*');
        if (!error && data) {
          const merged = [...flights];
          data.forEach(rf => { if (!merged.some(f => f.id === rf.id)) merged.push(rf); });
          flights = merged;
          reindexFlightNumbers();
          localStorage.setItem('speedfly_flights', JSON.stringify(flights));
          render();
        }
        syncStatus.textContent = "🟢 Synced with Cloud";
      } catch (err) {
        syncStatus.textContent = "⚡ Offline / Sync Error";
      }
    }

    async function pushFlightToCloud(flight) {
      if (!supabaseClient || !navigator.onLine) return;
      try { await supabaseClient.from('flights').upsert([flight]); } catch (e) {}
    }

    async function deleteFlightFromCloud(id) {
      if (!supabaseClient || !navigator.onLine) return;
      try { await supabaseClient.from('flights').delete().eq('id', id); } catch (e) {}
    }

    function updateElevationForSelectedSite() {
      const selectedSite = launchSiteSelect.value;
      const elev = siteElevations[selectedSite];
      launchElevation.value = (elev !== undefined) ? elev : '';
    }

    launchSiteSelect.addEventListener('change', updateElevationForSelectedSite);

    function handlePillClick(gridElement, callback) {
      gridElement.addEventListener('click', (e) => {
        const btn = e.target.closest('.pill-btn');
        if (!btn) return;
        gridElement.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        callback(btn.dataset.value);
      });
    }

    handlePillClick(wingPillGrid, val => selectedWing = val);
    handlePillClick(launchTypeGrid, val => selectedLaunchType = val);
    handlePillClick(windDescGrid, val => selectedWindDesc = val);
    handlePillClick(compassGrid, val => selectedCompass = val);
    handlePillClick(relativeWindGrid, val => selectedRelativeWind = val);

    logForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const elevVal = parseInt(launchElevation.value) || 0;
      const wSpeed = document.getElementById('windSpeed').value.trim();
      const rawDateVal = flightDateInput.value;
      const rawTimeVal = flightTimeInput.value;

      let formattedDate = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      if (rawDateVal) {
        const parts = rawDateVal.split('-');
        if (parts.length === 3) {
          formattedDate = new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
      }

      if (editingFlightId) {
        const idx = flights.findIndex(f => f.id === editingFlightId);
        if (idx !== -1) {
          flights[idx] = {
            ...flights[idx],
            date: formattedDate, rawDate: rawDateVal, rawTime: rawTimeVal,
            wing: selectedWing, site: launchSiteSelect.value, elevation: elevVal,
            launchType: selectedLaunchType,
            windSpeed: wSpeed ? (wSpeed.includes('kt') ? wSpeed : `${wSpeed} kt`) : '',
            windDesc: selectedWindDesc, compass: selectedCompass, relativeWind: selectedRelativeWind,
            notes: document.getElementById('notes').value.trim()
          };
          pushFlightToCloud(flights[idx]);
        }
        resetForm();
      } else {
        const newFlight = {
          id: Date.now(), flightNum: 0, date: formattedDate, rawDate: rawDateVal, rawTime: rawTimeVal,
          wing: selectedWing, site: launchSiteSelect.value, elevation: elevVal,
          launchType: selectedLaunchType, windSpeed: wSpeed ? `${wSpeed} kt` : '',
          windDesc: selectedWindDesc, compass: selectedCompass, relativeWind: selectedRelativeWind,
          notes: document.getElementById('notes').value.trim()
        };
        flights.push(newFlight);
        pushFlightToCloud(newFlight);
        resetForm();
      }

      reindexFlightNumbers();
      localStorage.setItem('speedfly_flights', JSON.stringify(flights));
      render();
      switchTab('tab-history');
    });

    function editFlight(id) {
      const flight = flights.find(f => f.id === id);
      if (!flight) return;

      editingFlightId = id;
      submitBtn.textContent = '💾 Save Changes';
      submitBtn.classList.add('editing');
      cancelEditBtn.classList.remove('hidden');

      if (flight.rawDate) flightDateInput.value = flight.rawDate;
      if (flight.rawTime) flightTimeInput.value = flight.rawTime;

      selectedWing = flight.wing || customWings[0];
      populateWingsUI();

      launchSiteSelect.value = flight.site;
      launchElevation.value = flight.elevation || 0;
      document.getElementById('windSpeed').value = flight.windSpeed ? parseInt(flight.windSpeed) : '';
      document.getElementById('notes').value = flight.notes || '';

      switchTab('tab-log');
    }

    function resetForm() {
      editingFlightId = null;
      submitBtn.textContent = '+ Log Flight';
      submitBtn.classList.remove('editing');
      cancelEditBtn.classList.add('hidden');
      setDefaultDateTime();
      document.getElementById('notes').value = '';
      document.getElementById('windSpeed').value = '';
    }

    cancelEditBtn.addEventListener('click', resetForm);

    function deleteFlight(id, flightNum) {
      if (confirm(`Delete Flight #${flightNum}?`)) {
        if (editingFlightId === id) resetForm();
        flights = flights.filter(f => f.id !== id);
        reindexFlightNumbers();
        localStorage.setItem('speedfly_flights', JSON.stringify(flights));
        deleteFlightFromCloud(id);
        render();
      }
    }

    function renderSettings() {
      const sitesList = document.getElementById('sitesSettingsList');
      sitesList.innerHTML = Object.keys(siteElevations).map(site => `
        <div class="settings-list-item">
          <input type="text" value="${site}" onchange="updateSiteName('${site}', this.value)">
          <input type="number" value="${siteElevations[site]}" onchange="updateSiteElev('${site}', this.value)" placeholder="ft">
          <button type="button" class="action-btn" onclick="deleteSite('${site}')">✕</button>
        </div>
      `).join('');

      const wingsList = document.getElementById('wingsSettingsList');
      wingsList.innerHTML = customWings.map(w => `
        <div class="settings-list-item">
          <span style="font-weight: 600; font-size: 0.9rem; flex: 1;">${w}</span>
          <button type="button" class="action-btn" onclick="deleteWing('${w}')">✕</button>
        </div>
      `).join('');
    }

    window.updateSiteName = function(oldName, newName) {
      const trimmedNew = newName.trim();
      if (!trimmedNew || oldName === trimmedNew) return;
      const currentElev = siteElevations[oldName];
      delete siteElevations[oldName];
      siteElevations[trimmedNew] = currentElev;
      localStorage.setItem('speedfly_site_elevations', JSON.stringify(siteElevations));
      populateSitesDropdown();
      renderSettings();
    };

    window.updateSiteElev = function(site, newElev) {
      siteElevations[site] = parseInt(newElev) || 0;
      localStorage.setItem('speedfly_site_elevations', JSON.stringify(siteElevations));
      populateSitesDropdown();
    };

    window.deleteSite = function(site) {
      if (confirm(`Remove site "${site}"?`)) {
        delete siteElevations[site];
        localStorage.setItem('speedfly_site_elevations', JSON.stringify(siteElevations));
        populateSitesDropdown();
        renderSettings();
      }
    };

    window.deleteWing = function(wingName) {
      if (customWings.length <= 1) return alert("Must keep at least one wing!");
      if (confirm(`Remove wing "${wingName}"?`)) {
        customWings = customWings.filter(w => w !== wingName);
        localStorage.setItem('speedfly_wings', JSON.stringify(customWings));
        if (selectedWing === wingName) selectedWing = customWings[0];
        populateWingsUI();
        populateFilterWings();
        renderSettings();
      }
    };

    document.getElementById('addNewSiteBtn').addEventListener('click', () => {
      const name = document.getElementById('newSiteName').value.trim();
      const elev = parseInt(document.getElementById('newSiteElev').value) || 0;
      if (!name) return;
      siteElevations[name] = elev;
      localStorage.setItem('speedfly_site_elevations', JSON.stringify(siteElevations));
      document.getElementById('newSiteName').value = '';
      document.getElementById('newSiteElev').value = '';
      populateSitesDropdown();
      renderSettings();
    });

    document.getElementById('addNewWingBtn').addEventListener('click', () => {
      const wing = document.getElementById('newWingName').value.trim();
      if (!wing) return;
      if (!customWings.includes(wing)) {
        customWings.push(wing);
        localStorage.setItem('speedfly_wings', JSON.stringify(customWings));
        populateWingsUI();
        populateFilterWings();
        renderSettings();
      }
      document.getElementById('newWingName').value = '';
    });

    document.getElementById('manualSyncBtn').addEventListener('click', syncWithCloud);

    // CALENDAR LOGIC
    function renderCalendar() {
      const year = calCurrentDate.getFullYear();
      const month = calCurrentDate.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      
      document.getElementById('calTitle').textContent = `${monthNames[month]} ${year}`;
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const flightDatesSet = new Set(flights.map(f => f.rawDate).filter(Boolean));

      let gridHtml = '';
      for (let i = 0; i < firstDay; i++) {
        gridHtml += `<div class="cal-cell empty"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const hasFlight = flightDatesSet.has(dateStr);
        const isSelected = selectedCalFilterDate === dateStr;

        gridHtml += `
          <div class="cal-cell ${hasFlight ? 'has-flight' : ''} ${isSelected ? 'selected-date' : ''}" 
               onclick="toggleCalendarDateFilter('${dateStr}')">
            ${d}
          </div>
        `;
      }
      document.getElementById('calendarDaysGrid').innerHTML = gridHtml;
    }

    window.toggleCalendarDateFilter = function(dateStr) {
      selectedCalFilterDate = (selectedCalFilterDate === dateStr) ? null : dateStr;
      renderCalendar();
      render();
    };

    document.getElementById('calPrevBtn').addEventListener('click', () => {
      calCurrentDate.setMonth(calCurrentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('calNextBtn').addEventListener('click', () => {
      calCurrentDate.setMonth(calCurrentDate.getMonth() + 1);
      renderCalendar();
    });

    // HISTOGRAM LOGIC
    function renderHistogram() {
      const bins = [
        { label: '<500ft', min: 0, max: 499, count: 0 },
        { label: '500-1k', min: 500, max: 999, count: 0 },
        { label: '1k-1.8k', min: 1000, max: 1799, count: 0 },
        { label: '1.8k-3k', min: 1800, max: 2999, count: 0 },
        { label: '3k+ ft', min: 3000, max: 99999, count: 0 }
      ];

      flights.forEach(f => {
        const elev = f.elevation || 0;
        const bin = bins.find(b => elev >= b.min && elev <= b.max);
        if (bin) bin.count++;
      });

      const maxCount = Math.max(...bins.map(b => b.count), 1);
      const histoContainer = document.getElementById('histogramContainer');

      histoContainer.innerHTML = bins.map(b => {
        const heightPct = (b.count / maxCount) * 80;
        return `
          <div class="histo-bar-wrap">
            <div class="histo-count">${b.count > 0 ? b.count : ''}</div>
            <div class="histo-bar" style="height: ${Math.max(heightPct, 4)}%;"></div>
            <div class="histo-label">${b.label}</div>
          </div>
        `;
      }).join('');
    }

    filterWingSelect.addEventListener('change', render);
    filterSiteSelect.addEventListener('change', render);

    exportBtn.addEventListener('click', () => {
      if (flights.length === 0) return alert('No flights logged yet!');
      let csv = 'Flight #,Date,Time,Wing,Launch Site,Elevation (ft),Launch Type,Wind Speed,Wind Quality,Compass Dir,Relative Wind,Notes\n';
      [...flights].reverse().forEach(f => {
        csv += `"${f.flightNum}","${f.date}","${f.rawTime || ''}","${f.wing}","${f.site}","${f.elevation || 0}","${f.launchType}","${f.windSpeed || ''}","${f.windDesc || ''}","${f.compass || ''}","${f.relativeWind || ''}","${f.notes}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = window.URL.createObjectURL(blob);
      a.download = `speedfly_logbook_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    });

    function render() {
      totalFlightsBadge.textContent = `${flights.length} Flight${flights.length === 1 ? '' : 's'}`;
      const totalVert = flights.reduce((sum, f) => sum + (f.elevation || 0), 0);
      totalVertBadge.textContent = `${totalVert.toLocaleString()} ft Vert`;

      renderCalendar();
      renderHistogram();

      let filteredFlights = [...flights];
      const wingFilter = filterWingSelect.value;
      const siteFilter = filterSiteSelect.value;

      if (wingFilter) filteredFlights = filteredFlights.filter(f => f.wing === wingFilter);
      if (siteFilter) filteredFlights = filteredFlights.filter(f => f.site === siteFilter);
      if (selectedCalFilterDate) filteredFlights = filteredFlights.filter(f => f.rawDate === selectedCalFilterDate);

      if (filteredFlights.length === 0) {
        logList.innerHTML = `<p style="text-align: center; color: rgba(255,255,255,0.6); margin-top: 20px;">No matching flights found.</p>`;
        return;
      }

      logList.innerHTML = filteredFlights.reverse().map(f => `
        <div class="log-item">
          <div>
            <div class="log-site-header">${f.site}</div>
            <div class="log-datetime-subheader">${f.date}${f.rawTime ? ' @ ' + f.rawTime : ''}</div>
            <div class="log-meta"><b>${f.wing}</b> • ${f.elevation ? f.elevation + ' ft' : 'N/A'} • ${f.launchType}</div>
            <div class="log-meta">Wind: ${f.windSpeed ? f.windSpeed + ' ' : ''}${f.windDesc} (${f.compass} ${f.relativeWind})</div>
            ${f.notes ? `<div class="log-meta" style="font-style: italic; margin-top: 2px;">"${f.notes}"</div>` : ''}
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
            <div class="action-row">
              <button type="button" class="action-btn" onclick="editFlight(${f.id})">✏️</button>
              <button type="button" class="action-btn" onclick="deleteFlight(${f.id}, ${f.flightNum})">✕</button>
            </div>
            <div class="log-num">#${f.flightNum}</div>
          </div>
        </div>
      `).join('');
    }

    populateWingsUI();
    populateSitesDropdown();
    populateFilterWings();
    renderSettings();
    reindexFlightNumbers();
    render();
    window.addEventListener('online', syncWithCloud);
    syncWithCloud();
  </script>
</body>
</html>
